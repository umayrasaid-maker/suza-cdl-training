services:
  - type: web
    name: suza-cdl-training
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 app:app
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: CDL_DB_PATH
        value: /tmp/cdl.sqlite3
      - key: REGISTRATION_ENABLED
        value: "false"
