services:
  - type: web
    name: suza-cdl-training
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 app:app
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: CDL_DB_PATH
        value: /var/data/cdl.sqlite3
    disk:
      name: cdl-registration-data
      mountPath: /var/data
      sizeGB: 1
